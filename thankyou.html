<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank You | Tiny Team Digital Studio</title>
<link rel="stylesheet" href="tinyteam.css">
<style>
body{
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  height:100vh;text-align:center;
  background:linear-gradient(180deg,#a7c7e7 0%,#f9f6ee 70%);
  animation:fadeIn 2s ease;
}
img{
  width:140px;border-radius:50%;
  box-shadow:0 0 35px rgba(167,199,231,.7);
  animation:float 6s ease-in-out infinite;
}
h1{color:var(--brown);margin-top:20px;font-size:1.8rem}
p{color:#444;margin-top:10px;font-size:1rem}
a.btn{
  margin-top:25px;text-decoration:none;
  padding:12px 24px;border-radius:25px;
  background:var(--brown);color:#fff;font-weight:600;
  transition:.3s;
}
a.btn:hover{background:var(--blue)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
</style>
<script>
  // Redirect to homepage after 3 seconds
  setTimeout(() => {
    window.location.href = "index.html";
  }, 3000);
</script>
</head>
<body>
  <img src="logo.png" alt="Tiny Team Digital Studio Logo">
  <h1>Thank You!</h1>
  <p>Your message has been sent successfully.<br>We’ll get back to you soon 🌙</p>
  <a href="index.html" class="btn">Back to Home</a>
</body>
</html>
